<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            text-align: center;
            padding: 100px 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            max-width: 550px;
            margin: auto;
            box-shadow: 0 4px 15px #0001;
        }

        h1 {
            color: #2563eb;
        }

        p {
            color: #475569;
        }

        button {
            background: #2563eb;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Welcome to StudentHub 🎓</h1>

        <p>Student Management System</p>

        <p>Manage students, courses and academic records.</p>

        <button onclick="alert('StudentHub is working!')">
            Get Started
        </button>
    </div>
</body>
</html>
